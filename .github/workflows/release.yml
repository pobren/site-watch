# Publishes a release: the npm installer (@mrpwob/site-watch) and a GitHub release with the notes from
# CHANGELOG.md. Run it from the Actions tab: it tags the version in package.json itself.
# Publishes with npm trusted publishing (set up on npmjs.com for release.yml), so it needs no npm token.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Version and notes
        id: v
        run: |
          version=$(jq -r '.version' package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="## ${version}:" 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          echo "title=$(grep -m1 "^## ${version}:" CHANGELOG.md | sed 's/^## [^:]*: //')" >> "$GITHUB_OUTPUT"
      - run: npm run package
      - name: Publish to npm
        working-directory: npm
        # The very first publish needs an NPM_TOKEN secret (npm can't trust a workflow for a package that doesn't
        # exist yet). After that, trusted publishing takes over and the secret can be deleted.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm install -g npm@11 && npm publish --provenance --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" --title "Site Watch ${{ steps.v.outputs.version }}: ${{ steps.v.outputs.title }}" --notes-file "$RUNNER_TEMP/notes.md"
